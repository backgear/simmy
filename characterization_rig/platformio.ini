; characterization_rig -- single-axis characterization device firmware
;
; Target: "Blue Pill" STM32F103C8T6, talking the USB-CDC binary protocol
; defined in docs/axis_device_protocol.md (AXIS framing, JSON ops, DATA
; blocks). This board is a *medium-density* F103: no on-chip DAC, three
; general-purpose timers free for hardware quadrature decode once one
; timer is reserved for edge scheduling, and 20KB of SRAM total. HELLO
; reports capabilities that reflect those real limits; see src/README
; notes in axis_hw.h for what is and is not implemented.

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USBD_MANUFACTURER_STRING=\"simmy\"
    -D USBD_PRODUCT_STRING=\"characterization_rig\"
    -std=gnu++17
build_unflags =
    -std=gnu++11
    -std=gnu++14

; Default upload uses an ST-Link. Boards flashed via the USB DFU bootloader
; (BOOT0 jumper) should override with `-t upload --upload-port` or
; `pio run -t upload -e bluepill_f103c8 --upload-protocol dfu` as needed.
upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

lib_archive = no
